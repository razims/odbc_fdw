services:
  dev:
    build:
      context: .
      target: dev
    working_dir: /workspace
    volumes:
      - .:/workspace
    stdin_open: true
    tty: true

  test:
    build:
      context: .
      target: test-runner
    working_dir: /workspace
    command: ["bash", "/workspace/docker/run-local-tests.sh"]

  sqlite:
    build:
      context: .
      target: test-runner
    working_dir: /workspace
    command: ["bash", "/workspace/test/sqlite/probe-sqlite.sh"]

  mysql-db:
    image: mysql:9.7.1@sha256:cbade841779f1661300e705721f9d2ff159865cc7a8a291affbff43ac6ec7f1d
    environment:
      MYSQL_DATABASE: odbc_fdw_test
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: OdbcFdw_MySQL_Test_2026!
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mysql:
    build:
      context: .
      target: test-runner
    working_dir: /workspace
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql-db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: odbc_fdw_test
      MYSQL_USER: root
      MYSQL_PASSWORD: OdbcFdw_MySQL_Test_2026!
    command: ["bash", "/workspace/test/mysql/probe-mysql.sh"]

  mssql-db:
    platform: linux/amd64
    image: mcr.microsoft.com/mssql/server:2025-latest@sha256:4bab24f36c1ecd48e85f7d37df26e6bf301641d84c3fe652f9a0dcc947d512e1
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: OdbcFdw_MSSQL_Test_2026!
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  mssql:
    build:
      context: .
      target: test-runner
    working_dir: /workspace
    depends_on:
      mssql-db:
        condition: service_healthy
    environment:
      MSSQL_HOST: mssql-db
      MSSQL_PORT: "1433"
      MSSQL_DATABASE: master
      MSSQL_USER: sa
      MSSQL_PASSWORD: OdbcFdw_MSSQL_Test_2026!
    command: ["bash", "/workspace/test/mssql/probe-mssql.sh"]

  hana:
    build:
      context: .
      target: test-runner
    working_dir: /workspace
    env_file:
      - .env
    command: ["bash", "/workspace/test/hana/probe-hana.sh"]

  hana-seed:
    build:
      context: .
      target: test-runner
    working_dir: /workspace
    env_file:
      - .env
    command: ["bash", "/workspace/test/hana/seed-hana.sh"]

  hana-clean:
    build:
      context: .
      target: test-runner
    working_dir: /workspace
    env_file:
      - .env
    command: ["bash", "/workspace/test/hana/clean-hana.sh"]

  oracle:
    platform: linux/amd64
    build:
      context: .
      target: oracle-test-runner
    working_dir: /workspace
    env_file:
      - .env
    command: ["bash", "/workspace/test/oracle/probe-oracle.sh"]

  oracle-seed:
    platform: linux/amd64
    build:
      context: .
      target: oracle-test-runner
    working_dir: /workspace
    env_file:
      - .env
    command: ["bash", "/workspace/test/oracle/seed-oracle.sh"]

  oracle-clean:
    platform: linux/amd64
    build:
      context: .
      target: oracle-test-runner
    working_dir: /workspace
    env_file:
      - .env
    command: ["bash", "/workspace/test/oracle/clean-oracle.sh"]
