services:
  dev:
    build:
      context: .
      target: dev
    working_dir: /workspace
    volumes:
      - .:/workspace
    stdin_open: true
    tty: true

  test:
    build:
      context: .
      target: test-runner
    working_dir: /workspace
    command: ["bash", "/workspace/docker/run-local-tests.sh"]

  hana:
    build:
      context: .
      target: test-runner
    working_dir: /workspace
    env_file:
      - .env
    command: ["bash", "/workspace/test/hana/probe-hana.sh"]

  hana-seed:
    build:
      context: .
      target: test-runner
    working_dir: /workspace
    env_file:
      - .env
    command: ["bash", "/workspace/test/hana/seed-hana.sh"]

  hana-clean:
    build:
      context: .
      target: test-runner
    working_dir: /workspace
    env_file:
      - .env
    command: ["bash", "/workspace/test/hana/clean-hana.sh"]

  oracle:
    platform: linux/amd64
    build:
      context: .
      target: oracle-test-runner
    working_dir: /workspace
    env_file:
      - .env
    command: ["bash", "/workspace/test/oracle/probe-oracle.sh"]

  oracle-seed:
    platform: linux/amd64
    build:
      context: .
      target: oracle-test-runner
    working_dir: /workspace
    env_file:
      - .env
    command: ["bash", "/workspace/test/oracle/seed-oracle.sh"]

  oracle-clean:
    platform: linux/amd64
    build:
      context: .
      target: oracle-test-runner
    working_dir: /workspace
    env_file:
      - .env
    command: ["bash", "/workspace/test/oracle/clean-oracle.sh"]
